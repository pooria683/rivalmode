name: RivalMode setup

# Runs on install (and any time you edit .rivalmode/config.json).
# Writes the README sections, renders the first scoreboard, and commits it —
# so a fresh "Use this template" repo shows a live card within one run.

on:
  push:
    branches: ['**']
    paths:
      - '.rivalmode/config.json'
      - 'src/**'
      - 'themes/**'
      - '.github/workflows/rivalmode-setup.yml'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme to install (see themes/)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Shares the publish group with the hourly job: both write the README.
concurrency:
  group: rivalmode-publish
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, render and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RIVALMODE_REPO: ${{ github.repository }}
          THEME: ${{ inputs.theme }}
        run: |
          set -euo pipefail
          git config user.name "rivalmode[bot]"
          git config user.email "rivalmode[bot]@users.noreply.github.com"
          if [ -n "${THEME}" ]; then
            node src/cli.mjs setup --theme="${THEME}"
          else
            node src/cli.mjs setup
          fi
          tools/publish.sh "chore(rivalmode): install + first scoreboard [skip ci]" node src/cli.mjs scoreboard
