name: RivalMode rivals

# Daily: scan forks, topic-neighbours and fans, re-rank the cluster, and redraw
# the ladder. Deliberately separate from the hourly job so the expensive search
# calls (and the ETag cache churn) happen once a day.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: rivalmode-rivals
  cancel-in-progress: false

jobs:
  rivals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rank the cluster
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RIVALMODE_REPO: ${{ github.repository }}
        run: node src/cli.mjs rivals

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "rivalmode[bot]"
          git config user.email "rivalmode[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "rival ladder unchanged"
            exit 0
          fi
          git add -A
          git commit -m "chore(rivalmode): daily rival scan [skip ci]"
          for attempt in 1 2 3; do
            if git push; then break; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done

      - name: Roast on rank loss
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The launch hook: when a rival passes us, say so out loud.
          node -e '
            const fs = require("fs");
            const p = ".rivalmode/state/rivals.json";
            if (!fs.existsSync(p)) process.exit(0);
            const state = JSON.parse(fs.readFileSync(p, "utf8"));
            const changes = state.ranking && state.ranking.changes;
            if (!changes || !changes.passedBy || !changes.passedBy.length) process.exit(0);
            const names = changes.passedBy.map((c) => "`" + c.slug + "`").join(", ");
            const body = [
              "### ⚔️ A rival just passed this repo",
              "",
              names + " moved ahead of `" + process.env.RIVALMODE_REPO + "` on the star-velocity ladder.",
              "",
              "| | |",
              "|:--|:--|",
              "| New rank | **#" + state.ranking.rank + " of " + state.ranking.clusterSize + "** |",
              "| Passed by | " + names + " |",
              "| Detected | " + new Date().toISOString() + " |",
              "",
              "The ladder is in the README. Go and take it back.",
            ].join("\n");
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY || "/dev/stderr", body);
            fs.writeFileSync("/tmp/roast.md", body);
          '
          gh issue comment "${{ github.event.issue.number || 0 }}" --body-file /tmp/roast.md 2>/dev/null || echo "no issue to comment on — posted to the run summary instead"

      - name: Summary
        if: always()
        run: |
          echo "### RivalMode rival scan" >> "$GITHUB_STEP_SUMMARY"
          cat .rivalmode/state/rivals.json 2>/dev/null | head -40 >> "$GITHUB_STEP_SUMMARY" || true
